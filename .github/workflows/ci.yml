# Continuous integration: lint, test and build every app on each push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which apps exist in this commit (lets each app's job skip cleanly if its folder is absent).
  detect:
    name: Detect apps
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.apps.outputs.admin }}
      mobile: ${{ steps.apps.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - id: apps
        run: |
          echo "admin=$([ -f apps/admin/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "mobile=$([ -f apps/mobile/pubspec.yaml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  api:
    name: API (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sofreh
          POSTGRES_PASSWORD: sofreh
          POSTGRES_DB: sofreh
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U sofreh" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sofreh:sofreh@localhost:5433/sofreh?schema=public
      REDIS_URL: redis://localhost:6380
      JWT_ACCESS_SECRET: ci-only-secret
      OTP_DEV_MODE: "true"
      CORS_ORIGINS: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx prisma migrate deploy
      - run: node prisma/seed.ts
      - run: npm run test:e2e
      - run: npm run build

  admin:
    name: Admin panel (Next.js)
    needs: detect
    if: needs.detect.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    name: Mobile app (Flutter)
    needs: detect
    if: needs.detect.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [detect, api, admin]
    # Run after the API job; the admin job may be skipped when the app isn't in the repo yet.
    if: always() && needs.api.result == 'success' && needs.admin.result != 'failure'
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          if [ "${{ needs.detect.outputs.admin }}" = "true" ]; then
            docker compose --profile full build
          else
            docker compose --profile full build api
          fi
