# Sofreh reverse proxy: one origin for everything.
#   /            → admin panel (Next.js)
#   /api/        → NestJS API (REST + Swagger at /api/docs)
#   /uploads/    → images served by the API (cached)
#   /socket.io/  → real-time updates (WebSocket upgrade)
#
# For HTTPS in production, add a `listen 443 ssl` server with your certificate
# (or put this behind the hosting provider's TLS terminator / CDN).

upstream sofreh_api {
  server api:4100;
}

upstream sofreh_admin {
  server admin:3100;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 10m;  # image uploads (the API allows 8 MB)

  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;
  gzip_min_length 1024;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ {
    proxy_pass http://sofreh_api;
  }

  location /uploads/ {
    proxy_pass http://sofreh_api;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location /socket.io/ {
    proxy_pass http://sofreh_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://sofreh_admin;
  }
}
