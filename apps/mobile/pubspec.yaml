name: sofreh
description: "Sofreh (سفره) — customer app of a Persian food-delivery demo."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Referenced by Cupertino widgets in the framework.
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.3
  # Navigation (declarative routes, auth redirect, bottom-nav shell)
  go_router: ^18.1.1
  # HTTP client with interceptors (auth header + token refresh)
  dio: ^5.11.1
  # Live order status updates
  socket_io_client: ^3.1.6
  # Session tokens and cart persistence (see core/storage)
  shared_preferences: ^2.5.6
  cached_network_image: ^4.0.5
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true


  # Vazirmatn (SIL Open Font License, see assets/fonts/OFL.txt), bundled so the
  # app does not depend on Google Fonts at runtime.
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
